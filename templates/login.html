{% extends "base.html" %}

{% block title %}Login | Skiné{% endblock %}

{% block content %}

<section class="login-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-8">

                <div class="login-card">

                    <div class="text-center mb-4">

                        <span class="hero-tag">Welcome</span>

                        <h1 class="login-title">Login</h1>

                        <p class="login-text">
                            Sign in to access your skin analysis dashboard.
                        </p>

                    </div>

                    <form method="POST" action="{{ url_for('login') }}">

                        <div class="mb-4">

                            <label class="form-label">Email Address</label>

                            <input
                                type="email"
                                name="email"
                                class="form-control custom-input"
                                placeholder="Enter your email"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">Password</label>

                            <input
                                type="password"
                                name="password"
                                class="form-control custom-input"
                                placeholder="Enter your password"
                                required>

                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="remember">

                                <label class="form-check-label" for="remember">
                                    Remember Me
                                </label>

                            </div>

                            <a href="#" class="forgot-link">
                                Forgot Password?
                            </a>

                        </div>

                        <button type="submit" class="hero-btn w-100 justify-content-center">

                            <i class="fa-solid fa-right-to-bracket"></i>
                            Login

                        </button>

                        <div class="text-center mt-4">

                            <p class="mb-0">

                                Don't have an account?

                                <a href="{{ url_for('register') }}" class="register-link">
                                    Create Account
                                </a>

                            </p>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
