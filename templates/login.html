{% extends "base.html" %}

{% block title %}Login | Skiné{% endblock %}

{% block content %}

<section class="login-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="login-card p-4 p-md-5 shadow-sm" style="border-radius: 20px;">
                    <div class="text-center mb-4">
                        <span class="hero-tag">Welcome Back</span>
                        <h1 class="login-title fw-bold" style="color: var(--green-dark);">Sign In</h1>
                        <p class="login-text small text-muted">
                            Sign in to access your skin health history, customized routines, and tracking dashboard.
                        </p>
                    </div>

                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Email Address</label>
                            <input
                                type="email"
                                name="email"
                                class="form-control custom-input"
                                placeholder="name@example.com"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Password</label>
                            <input
                                type="password"
                                name="password"
                                class="form-control custom-input"
                                placeholder="••••••••"
                                required>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember" name="remember">
                                <label class="form-check-label small text-muted" for="remember">
                                    Remember me
                                </label>
                            </div>
                            <span class="small text-muted">Demo: user@skinai.com / password123</span>
                        </div>

                        <button type="submit" class="hero-btn w-100 justify-content-center">
                            <i class="fa-solid fa-right-to-bracket"></i>
                            Sign In
                        </button>

                        <div class="text-center mt-4">
                            <p class="mb-0 small text-muted">
                                Don't have an account?
                                <a href="{{ url_for('register') }}" class="fw-bold" style="color: var(--green);">
                                    Create one now
                                </a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
