{% extends "base.html" %}

{% block title %}Create Account | Skiné{% endblock %}

{% block content %}

<section class="register-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="register-card p-4 p-md-5 shadow-sm" style="border-radius: 20px;">
                    <div class="text-center mb-4">
                        <span class="hero-tag">Join Skiné</span>
                        <h1 class="register-title fw-bold" style="color: var(--green-dark);">Create Account</h1>
                        <p class="register-text small text-muted">
                            Start tracking your skin characteristics and receiving AI-guided skincare regimens.
                        </p>
                    </div>

                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Full Name</label>
                            <input
                                type="text"
                                name="full_name"
                                class="form-control custom-input"
                                placeholder="Your full name"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Email Address</label>
                            <input
                                type="email"
                                name="email"
                                class="form-control custom-input"
                                placeholder="name@example.com"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Password (min. 6 characters)</label>
                            <input
                                type="password"
                                name="password"
                                class="form-control custom-input"
                                placeholder="••••••••"
                                minlength="6"
                                required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted">Confirm Password</label>
                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control custom-input"
                                placeholder="••••••••"
                                minlength="6"
                                required>
                        </div>

                        <button type="submit" class="hero-btn w-100 justify-content-center">
                            <i class="fa-solid fa-user-plus"></i>
                            Register Account
                        </button>

                        <div class="text-center mt-4">
                            <p class="mb-0 small text-muted">
                                Already have an account?
                                <a href="{{ url_for('login') }}" class="fw-bold" style="color: var(--green);">
                                    Sign In
                                </a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
